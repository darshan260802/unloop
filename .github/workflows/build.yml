name: Build
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unloop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Validate all puzzle fixtures
        run: bun run validate:puzzles
      - run: bun run build

      - name: Install browser smoke-check tools
        run: bun add --no-save --ignore-scripts playwright@1.58.2
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check touch gestures and reduced motion
        run: bun run scripts/validate-gestures.ts
